dding:6px 10px;font-size:.8rem;min-height:36px}.start{display:flex;flex-direction:column;min-height:calc(100svh - 60px)}.start-art{min-height:255px;height:31svh}.start-art:after{border:0;background:linear-gradient(180deg,transparent 70%,#111018)}.ticket{bottom:12px;left:18px;right:18px;padding:10px 16px}.ticket p{font-size:1rem;margin:4px 0}.start-copy{padding:24px 24px 40px}.title{font-size:5.8rem;margin:18px 0 25px}.case-title{font-size:1.55rem;margin-bottom:15px}.start-copy .blurb{font-size:.94rem}.fine{margin-top:18px}.game{display:flex;flex-direction:column;min-height:auto}.scene{position:relative;top:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}.scene-image{height:180px;min-height:180px;flex:auto;background-position:center 55%}.scene-caption{bottom:12px!important;left:20px!important}.scene-caption h2{font-size:1.45rem;margin:6px 0}.scene-caption .kicker{font-size:.75rem}.cipher{padding:16px 20px}.cipher p{font-size:.875rem}.cipher-face{font-size:1.2rem}.cipher-label{margin-bottom:8px}.cipher-actions{margin-top:12px}.surface{padding:20px 18px 40px}.tabs{margin-bottom:22px;gap:2px;padding-bottom:10px}.tabs button{font-size:.875rem;padding:7px 9px;min-height:39px}.room-tabs{gap:8px}.room-tabs button{padding:12px;font-size:.875rem}.room-tabs small{font-size:.75rem}.cards{grid-template-columns:1fr 1fr;gap:10px}.cast-card{padding:15px}.cast-card h3{font-size:1rem}.cast-card small{font-size:.75rem}.avatar{width:40px;height:40px;margin-bottom:12px}.present-list{grid-template-columns:1fr 1fr}.present-list button{font-size:.85rem;padding:11px}.dialogue{padding-left:16px;margin:22px 0}.dialogue p{font-size:1.02rem;line-height:1.8}.claim{padding:20px;font-size:1.05rem}.timeline-row{padding:12px 10px;gap:10px}.timeline-row p{font-size:.875rem}.order-buttons{flex-direction:column}.order-buttons button{font-size:1rem;min-height:33px;padding:2px 9px}dialog{padding:24px 20px}.stats{gap:6px}.stats strong{font-size:1.3rem}.stats small{font-size:.75rem}.relay-box{padding:18px}.section-top{align-items:flex-start}.section-top .count{padding-top:9px}.ending-stamp{font-size:3rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>const CASE = {
 id:'last-bell-01', title:'The Ninth Note', victim:'Nao',
 cast:[
 {id:'mira',name:'Mira Akiyama',short:'Mira',talent:'Ultimate Pianist',color:'#bb9bff',initials:'MA',line:'If I put the ugly things into music, maybe they stay there.',bio:'Her recitals leave audiences hopeful and her hands shaking. She dislikes applause almost as much as silence.',intro:'Nao asked me to play something happy. I told him I don’t write happy music. He said, “That isn’t what I asked.”',talk:[['What did you hear?','At 21:12, the piano started again. Nao’s little practice piece. I thought he was alive. Then I heard a cough between the fifth and sixth notes. My cough.'],['Your evening?','I was with Eden in the conservatory from 20:50 until the body announcement. Ask them. I recorded that piece here this afternoon, because Nao wanted to learn it.'],['Why that melody?','He called it The Ninth Note. There are only eight notes in the phrase. He said the ninth was the person who stayed to listen. Stupid. …I liked it.']]},
 {id:'riku',name:'Riku Kurose',short:'Riku',talent:'Ultimate Stage Engineer',color:'#ffc46a',initials:'RK',line:'A show only works if someone makes sure nobody gets hurt.',bio:'The backstage safety officer who checks everyone’s harness twice. His own hands are never still.',intro:'Don’t stand under the fly tower. Those weights can kill somebody. Sorry. Habit. I’m Riku.',talk:[['Your evening?','Workshop. 20:50 to 21:20. Alone. I was repairing a trolley clamp. Sera borrowed my yellow trolley earlier, so don’t make that into something.'],['The sealed door?','The front door latches automatically. Everyone knows that. The service hatch is— …probably irrelevant. It’s a music room, not a bunker.'],['What was Nao doing?','Digging through the theatre controller. He said he found tomorrow’s “encore.” I told him to leave it alone. Sometimes knowing everything makes it worse.']]},
 {id:'sera',name:'Sera Mikami',short:'Sera',talent:'Ultimate Restorer',color:'#8cd9c6',initials:'SM',line:'A crack is a fact. Covering it doesn’t make it a lie.',bio:'Careful, dry, and very good at making damaged things look untouched. She refuses to restore the school’s security cameras.',intro:'An academy built over a theatre. The gold leaf is real. The promise that we’re safe probably isn’t.',talk:[['The trolley?','I borrowed Riku’s yellow trolley at 19:40 to move a frame. Returned it at 20:10. I wrote the return in the studio ledger. The smear on its wheel was already there.'],['Your evening?','Toma delivered solvent to my studio at 20:55. Stayed until 21:18, talking far too much. The short power cut happened while we were together.'],['Could the room be locked?','A locked front door proves one door was locked. That’s it. People get hypnotized by a good-looking lock.']]},
 {id:'toma',name:'Toma Arata',short:'Toma',talent:'Ultimate Courier',color:'#ff8ea4',initials:'TA',line:'If the world ends, I’m charging extra for delivery.',bio:'Fast feet, loud jokes, and a habit of remembering the parts of a route everyone else overlooks.',intro:'You’re the new one? Nice. If a weird clock asks you to sign anything, use a fake name. That’s free advice.',talk:[['Your route?','At 20:55 I passed the recital room. Nao was there with Riku. Yellow trolley, big coil of cable. Then I went straight to Sera’s studio.'],['Could it be someone else?','Not unless someone borrowed his voice, too. He said “watch your fingers” when Nao touched the clamp. It was Riku. I’m not guessing.'],['Why joke now?','Because if I stop, I’m going to remember Nao asking whether I could carry a letter out for him. I said sure. Didn’t even ask who it was for.']]},
 {id:'eden',name:'Eden Saeki',short:'Eden',talent:'Ultimate Botanist',color:'#b5da8a',initials:'ES',line:'You can’t make something grow by pulling it upward.',bio:'Keeps a tiny garden alive under the theatre’s artificial sun. Quiet does not mean gentle.',intro:'The plants don’t know we’re prisoners. I’ve been trying to let them keep that.',talk:[['Mira’s alibi?','With me from 20:50 onward. We were repotting a fern. At 21:12 we both heard the music through the vent. She went white before the body announcement.'],['The blackout?','Eight seconds at 21:10. The greenhouse lamp timer logged it. The music began two minutes after the lights returned. That power cut did not happen during the killing.'],['Nao’s secret?','He told me not to water the orchids tomorrow. “We might all be gone by breakfast,” he said. I thought he meant escape. I wanted him to mean escape.']]},
 {id:'nao',name:'Nao Shigure',short:'Nao',talent:'Ultimate Archivist',color:'#91b6eb',initials:'NS',line:'A memory belongs to the person who lived it.',bio:'Never deletes an embarrassing photograph. Says the person in it deserves a chance to recognize themselves.',intro:'There’s a piano recording in the recital room. Eight notes and a cough. I’m learning it. If we get out, you’re all invited to my terrible first concert.'}
 ],
 rooms:[
 {id:'hall',name:'Recital hall',label:'Where the music stopped',desc:'The grand piano is open. Nao lies beside its bench. A pool of pink light spills from the broken emergency lamp. The front door is latched from the inside.',spots:[['report','Examine Nao','The body'],['clock','Inspect the fallen watch','Beside the bench'],['piano','Listen to the piano spool','Inside the piano'],['weight','Inspect the fly tower','Above the stage']]},
 {id:'backstage',name:'Behind the curtain',label:'Every illusion has a back',desc:'Dust hangs in the rigging. A low service hatch connects the hall to the backstage corridor. Someone recently dragged something heavy through it.',spots:[['hatch','Inspect the service hatch','Near the rigging'],['track','Trace the wheel marks','On the floor'],['cue','Read the controller log','Stage control'],['letter','Open Nao’s envelope','Under the console']]},
 {id:'workshop',name:'The workshop',label:'A place for fixing things',desc:'Clamps, cables, old costumes. Riku’s yellow equipment trolley stands by the wall. It is missing one bronze counterweight.',spots:[['clamp','Check the damaged clamp','On the trolley'],['spool','Read the spool register','Equipment desk'],['ledger','Check the return ledger','Clipped to the wall']]},
 {id:'garden',name:'Conservatory',label:'Something still alive',desc:'The fern on the table is freshly repotted. Eden’s lamp timer blinks 21:10. Mira sits beside a glass of water she hasn’t touched.',spots:[['timer','Read the lamp timer','Plant light'],['memo','Read Nao’s archive note','On the table']]}
 ],
 clues:{
 report:{title:'Medical observation',room:'hall',type:'BODY',text:'Nao died from one heavy blow to the back of the head. No electrical burns. A bronze counterweight fits the injury. Its impact would have made it impossible for him to play afterward.'},
 clock:{title:'Stopped wristwatch',room:'hall',type:'TIME',text:'Nao’s mechanical watch stopped at 20:58. Its face was shattered beneath his body, with a dent corresponding to the fall. This supports an earlier death; it does not establish the time by itself.'},
 piano:{title:'The identical cough',room:'hall',type:'SOUND',text:'The piano is an electric player piano with a battery-backed audio module. Its spool plays eight notes, then Mira’s cough in exactly the same place as the music heard at 21:12. The sound was a recording, not Nao playing live.'},
 weight:{title:'Bronze counterweight',room:'hall',type:'WEAPON',text:'One removable bronze weight lies behind the bench. Pink residue and a broken amber resin chip cling to its mounting notch. It can be removed from a trolley clamp without operating the overhead rig.'},
 hatch:{title:'Unlatched service hatch',room:'backstage',type:'ROUTE',text:'The front door latches automatically when shut. The low backstage service hatch has an independent manual latch. It is unlatched, allowing someone to leave the hall without unlocking the front door.'},
 track:{title:'Yellow wheel scrape',room:'backstage',type:'TRACE',text:'Fresh yellow lacquer runs from the bench, through the service hatch, toward the workshop. The scrape spacing matches the yellow equipment trolley. Other academy carts are blue.'},
 cue:{title:'Playback cue log',room:'backstage',type:'RECORD',text:'At 21:02 the local stage controller scheduled spool 38 for 21:12. Authorization: Riku’s assigned wristband R-17. The log records the band, not the wearer. The player’s battery module survives brief power cuts.'},
 letter:{title:'Nao’s unopened letter',room:'backstage',type:'MOTIVE',text:'“Riku: the encore protocol is real. At 06:00 it wipes our personal archives and opens the exhaust vents. I’m copying proof. Please don’t smash the controller; I still need its override. Meet me before nine. — Nao”'},
 clamp:{title:'Broken resin clamp',room:'workshop',type:'MATCH',text:'The yellow trolley’s clamp has a fresh triangular break in its amber repair resin. The loose chip on the bronze weapon fits that break. This links the weapon to the trolley, though the trolley could have been borrowed.'},
 spool:{title:'Spool 38 register',room:'workshop',type:'RECORD',text:'Mira recorded spool 38 at 15:40. At 20:46, Riku signed it out with his R-17 band. No later handover is recorded. His nearby repair worksheet was never stamped that evening.'},
 ledger:{title:'Sera’s return ledger',room:'workshop',type:'ALIBI',text:'Sera returned the yellow trolley at 20:10. Riku countersigned the return at 20:14. Toma’s delivery slip places him in Sera’s studio from 20:55 to 21:18. Her earlier borrowing cannot explain its use near 20:58.'},
 timer:{title:'Eight-second blackout',room:'garden',type:'TIME',text:'The conservatory timer logs a power interruption from 21:10:00 to 21:10:08. Eden and Mira were together here throughout. The music began at 21:12, after the lights returned.'},
 memo:{title:'Nao’s copied override',room:'garden',type:'SECRET',text:'Nao hid a complete copy of the encore override with Eden. His note says: “If I don’t come back, the shutdown phrase is NINTH NOTE. Read the evidence before you trust the show.”'},
 witness:{title:'Toma’s corridor sighting',room:'talk',type:'WITNESS',text:'At 20:55 Toma saw and heard Riku with Nao in the recital hall, beside the yellow trolley. He then stayed with Sera until 21:18. This contradicts Riku’s claim to have been alone in the workshop from 20:50.'}
 },
 opening:[
 {who:'SYSTEM',title:'An audience of seven.',text:'You wake under a theatre seat with an admission ticket folded in your hand. Your name is printed beneath a title you never earned: ULTIMATE WITNESS. Six other students are waiting in the aisle. The doors have no handles on this side.'},
 {who:'MAESTRO',title:'Welcome to the final performance.',text:'The great clock above the stage speaks in a voice much too cheerful for its face. “A murder earns one of you an exit. Find the culprit in our class trial, and the rest survive. Choose wrong, and the killer takes the curtain call alone.”'},
 {who:'CIPHER',title:'A very small objection.',text:'A portable monitor flickers beside your seat. “(^_^;) Hello. I am CIPHER. Apparently my official talent is Ultimate Unnecessary Expense. I can remember what you find. I cannot decide what it means for you.” You lift it from the floor. “Oh. You are taking me with you. That is… statistically kind.”'},
 {who:'NAO',title:'The ninth note.',text:'Nao sits at the grand piano, playing a phrase badly and laughing when he misses its ending. “Mira says there isn’t a ninth note. I think there is. It’s whoever stays to listen.” The others have gathered in the hall. For a moment, it almost feels like school.'},
 {who:'SYSTEM',title:'21:30 / Body discovery.',text:'The announcement interrupts a melody coming from the recital hall. Nao is on the floor beside the piano bench. The main door was latched. You heard him playing eighteen minutes ago. Or you heard something that sounded like him.'}
 ],
 trial:[
 {speaker:'MAESTRO',title:'A living sound',statement:'We all heard Nao playing at 21:12. He was alive then. What other explanation could there be?',claim:'“The music proves Nao was alive at 21:12.”',answer:'piano',explain:'Those eight notes included the exact cough from Mira’s afternoon recording. A machine played the sound. Hearing music is not the same as hearing a living person.',partner:'(^_^;) A sound can be honest about what it is and still lie about who made it. Compare the recordings.',hint:'What tells you whether the performance was live?'},
 {speaker:'RIKU',title:'A convenient darkness',statement:'The power cut was at 21:10. Someone used those eight seconds to kill him. That has to be when it happened.',claim:'“Nao was killed during the 21:10 blackout.”',answer:'clock',explain:'The shattered watch supports a collapse at 20:58, twelve minutes before the outage. Together with the recorded performance and injury, it breaks the blackout theory.',partner:'(•_•) The loudest event is not necessarily the important event. What was already broken before the lights went out?',hint:'A damaged object supports an earlier collapse.'},
 {speaker:'SERA',title:'One door is not a room',statement:'Fine. An earlier death. But the door was locked from inside. If nobody could leave, the killer stayed with the body.',claim:'“The killer could not leave the locked recital hall.”',answer:'hatch',explain:'The front door latches by itself, but the service hatch has its own manual latch. It was left open. The room was never sealed.',partner:'(¬_¬) Architecture has more authority here than confidence. Check every way out.',hint:'How many entrances did you actually examine?'},
 {speaker:'RIKU',title:'Borrowed guilt',statement:'That trolley was in Sera’s hands. If its clamp matches the weapon, you know who to look at. I was in my workshop.',claim:'“Sera still had my trolley when Nao died.”',answer:'ledger',explain:'Sera returned it at 20:10, and Riku countersigned at 20:14. Toma’s delivery places her in the studio at 20:55. Her earlier borrowing is a distraction.',partner:'(._.) A true fact can be placed in the wrong hour. Put the borrowing back on the clock.',hint:'Who had possession of the trolley at the relevant time?'},
 {speaker:'RIKU',title:'The empty workshop',statement:'I told you. Workshop. 20:50 to 21:20. Nobody saw me leave. You can’t just invent me being in that room.',claim:'“I was alone in the workshop from 20:50 to 21:20.”',answer:'witness',explain:'Toma saw and heard Riku with Nao in the hall at 20:55. That breaks the alibi and puts him with the trolley immediately before the supported death time.',partner:'(•̀_•́) Not all evidence is an object. Someone remembers a voice.',hint:'A classmate’s delivery route passes the hall.'},
 {speaker:'MAESTRO',title:'An encore without a performer',statement:'Perhaps the music started itself during the outage. Such a wonderfully convenient accident. Nobody needed to arrange a thing!',claim:'“The 21:12 playback was an accident caused by the blackout.”',answer:'cue',explain:'A deliberate 21:02 cue scheduled spool 38 for 21:12. The battery-backed player survived the outage. Someone arranged a false performance after Nao’s death.',partner:'(>_<) The machine did what it was told. Find the instruction.',hint:'Which record distinguishes a scheduled action from an accident?'}
 ],
 timeline:[{id:'meeting',text:'Riku meets Nao in the hall',time:'20:55'},{id:'death',text:'Nao falls; his watch breaks',time:'20:58'},{id:'schedule',text:'The false performance is scheduled',time:'21:02'},{id:'outage',text:'The lights fail for eight seconds',time:'21:10'},{id:'play',text:'Spool 38 plays eight notes and a cough',time:'21:12'}]
};

'use strict';
const STORAGE='last-bell-save-v1', app=document.getElementById('app'), modal=document.getElementById('modal');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:1,phase:'start',intro:0,tab:'explore',room:'hall',found:[],talks:[],pinned:[],round:0,hope:5,errors:0,hints:0,revision:0,order:['play','meeting','outage','death','schedule'],result:null,partner:'',partnerTurns:0,ending:null,sound:false,bonds:{}});
let state=fresh(), saved=null, storageOK=true, audio=null, tuneTimer=null;
try{const raw=localStorage.getItem(STORAGE);if(raw){saved=validateSave(JSON.parse(raw));state={...saved,phase:'start'};}}catch(e){storageOK=false;}
function validateSave(x){if(!x||x.version!==1||!['start','opening','investigation','trial','timeline','verdict','resolution','ending'].includes(x.phase)||!Array.isArray(x.found)||!Array.isArray(x.talks)||!Array.isArray(x.pinned)||x.found.some(k=>!CASE.clues[k])||x.pinned.some(k=>!x.found.includes(k))||!Number.isInteger(x.round)||x.round<0||x.round>5||!Number.isInteger(x.intro)||x.intro<0||x.intro>4||!Number.isInteger(x.hope)||x.hope<0||x.hope>5||!Number.isInteger(x.revision)||!CASE.rooms.some(r=>r.id===x.room)||!Array.isArray(x.order)||x.order.length!==5||new Set(x.order).size!==5||x.order.some(k=>!CASE.timeline.some(t=>t.id===k)))throw Error('This is not a compatible LAST BELL save.');if(!['explore','cast','evidence','partner'].includes(x.tab)||x.talks.some(t=>typeof t!=='string'||!/^((mira|riku|sera|toma|eden):[0-2])$/.test(t))||new Set(x.found).size!==x.found.length||new Set(x.talks).size!==x.talks.length||typeof x.partner!=='string'||x.partner.length>1500||![x.errors,x.hints,x.partnerTurns].every(n=>Number.isInteger(n)&&n>=0)||!Number.isInteger(x.revision)||x.revision<0||(x.phase==='ending'&&!['wrong','normal','true'].includes(x.ending))||(x.result!==null&&(!x.result||typeof x.result.correct!=='boolean'||typeof x.result.text!=='string'||x.result.text.length>2000)))throw Error('This backup contains invalid game data.');return {...fresh(),...x};}
function persist(){state.revision++;try{localStorage.setItem(STORAGE,JSON.stringify(state));saved=JSON.parse(JSON.stringify(state));}catch(e){storageOK=false;}render();}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3500);}
function btn(label,action,args='',cls=''){return `<button class="${cls}" data-action="${action}"${args}>${label}</button>`;}
function head(){return `<header><div class="logo">LAST <span>BELL</span><div class="chapter" style="margin-top:8px">CASE 01 / THE NINTH NOTE</div></div><div class="header-actions">${btn(state.sound?'Sound on':'Sound off','sound','','small ghost')}${btn('Notebook','help','','small ghost')}${btn('Save','save','','small gold')}</div></header>`;}
function phaseLabel(){return {opening:'PROLOGUE / ADMISSION',investigation:'21:30 / INVESTIGATION',trial:'CLASS TRIAL / LIVE',timeline:'CLASS TRIAL / RECONSTRUCTION',verdict:'CLASS TRIAL / FINAL VOTE',resolution:'THE CURTAIN CALL',ending:'CASE CLOSED'}[state.phase]||'THEATRE ACADEMY';}
function partnerLine(){if(state.partner)return state.partner;if(state.phase==='trial')return CASE.trial[state.round].partner;if(state.phase==='timeline')return '(•_•) No time limit. Put the five events in order. You already have the timestamps.';if(state.phase==='verdict')return '(._.) A tool can be borrowed. A wristband can be borrowed. But an alibi that contradicts a witness needs an explanation.';if(state.phase==='resolution')return '(>_<) Solving the murder and accepting the rules are two different decisions.';if(state.phase==='ending')return state.ending==='true'?'(^_^) I think the ninth note is a person, too.':'(._.) I will remember him. That is something I can promise.';if(state.phase==='opening')return '(^_^;) I can hold the evidence. You hold the conclusions.';if(state.found.length===14)return '(•̀_•́) Every clue accounted for. A locked door. An impossible performance. Someone wanted the clock to lie.';if(state.found.includes('piano'))return '(•_•) Music isn’t an alibi if a machine can play it. Talk to the people who heard it.';return '(^_^;) Inspect the hall, follow the backstage route, and ask everyone where they were. Nothing here runs on a timer.';}
function scene(){return `<aside class="scene"><div class="scene-image" role="img" aria-label="Rain-soaked academy concert hall with a grand piano beneath a clock"><div class="scene-caption"><span class="kicker">${phaseLabel()}</span><h2>${state.phase==='investigation'?esc(CASE.rooms.find(r=>r.id===state.room).name):'The Ninth Note'}</h2></div></div><div class="cipher"><div class="cipher-label"><span class="kicker" style="color:var(--green)">CIPHER / YOUR PARTNER</span><span class="cipher-face" aria-hidden="true">${state.phase==='trial'?'(•̀_•́)':'(^_^;)'}</span></div><p>${esc(partnerLine())}</p><div class="cipher-actions">${btn('Pass to ChatGPT','relay','','small ghost')}${btn('Ask CIPHER','hint','','small ghost')}</div></div></aside>`;}
function nav(){return `<nav class="tabs" aria-label="Game views">${[['explore','Scene'],['cast','Classmates'],['evidence',`Evidence ${state.found.length}`],['partner','Partner']].map(([id,label])=>btn(label,'tab',` data-id="${id}"`,id===state.tab?'active':'')).join('')}</nav>`;}
function startView(){return `<div class="start"><div class="start-art" role="img" aria-label="A dark concert hall with a grand piano"><div class="ticket"><div class="kicker">ADMIT ONE / ULTIMATE WITNESS</div><p>“The ninth note is whoever stays to listen.”</p></div></div><main class="start-copy"><div class="kicker">AN ORIGINAL KILLING-GAME MYSTERY</div><h1 class="title">LAST<span>BELL.</span></h1><div class="case-title">Case 01: The Ninth Note</div><p class="blurb">A locked recital hall. Six extraordinary students. A dead boy you heard playing eighteen minutes ago.</p><div class="start-buttons">${saved&&saved.phase!=='start'?btn('Continue your investigation','continue','','primary'):''}${btn(saved&&saved.phase!=='start'?'Start a new case':'Enter the academy','new','',saved&&saved.phase!=='start'?'ghost':'primary')}</div><p class="fine">20–35 minutes · Turn-based · Three endings<br>Original cast. Inspired by Danganronpa.<br>No AI API. Your progress stays on this device.</p></main></div>`;}
function openingView(){const d=CASE.opening[state.intro];return `<div class="kicker">PROLOGUE / ${String(state.intro+1).padStart(2,'0')}</div><h2 style="margin-top:18px">${esc(d.title)}</h2><div class="dialogue"><div class="speaker">${esc(d.who)}</div><p>${esc(d.text)}</p></div><div class="opening-progress" aria-label="Prologue page ${state.intro+1} of 5">${CASE.opening.map((_,i)=>`<i class="${i<=state.intro?'done':''}"></i>`).join('')}</div>${btn(state.intro===4?'Begin investigation':'Continue','advance','','primary wide')}<p class="footer-note">Read at your own pace. There are no timed inputs.</p>`;}
const required=['report','piano','clock','hatch','ledger','witness','cue'];
function trialReady(){return required.every(k=>state.found.includes(k));}
function exploreView(){const r=CASE.rooms.find(r=>r.id===state.room);return `<div class="section-top"><h2>Investigate</h2><span class="count">${state.found.length}/14 CLUES</span></div><div class="room-tabs">${CASE.rooms.map(x=>btn(`${esc(x.name)}<small>${x.spots.filter(y=>state.found.includes(y[0])).length}/${x.spots.length} examined</small>`,'room',` data-id="${x.id}"`,x.id===r.id?'active':'')).join('')}</div><div class="kicker">${esc(r.label)}</div><p class="room-text" style="margin-top:12px">${esc(r.desc)}</p><div class="spots">${r.spots.map(([id,label,sub])=>btn(`<span>${esc(label)}<span class="sub">${esc(sub)}</span></span><span class="mark">${state.found.includes(id)?'READ':'+'}</span>`,'inspect',` data-id="${id}"`,'spot '+(state.found.includes(id)?'found':''))).join('')}</div><div class="trial-entry"><h3>The truth won’t argue for itself.</h3><p>${trialReady()?'You have the essential evidence. You can begin the trial, or keep looking for what the murder might be hiding.':'Inspect all four locations and question the classmates. CIPHER will let you know when the essential evidence is ready.'}</p>${btn(trialReady()?'Enter the class trial':'Check what’s missing','beginTrial','',trialReady()?'primary wide':'ghost wide')}</div>`;}
function castView(){return `<div class="section-top"><h2>Your classmates</h2><span class="count">${state.talks.length}/15 TOPICS</span></div><p class="muted">Listen carefully. An alibi is a claim, not a guarantee.</p><div class="cards">${CASE.cast.map(c=>btn(`<div class="avatar" style="color:${c.color}">${c.initials}</div><h3>${esc(c.short)}</h3><small>${esc(c.talent)}</small><span class="badge" style="margin-top:12px">${c.id==='nao'?'DECEASED':`${state.talks.filter(t=>t.startsWith(c.id+':')).length}/3 topics`}</span>`,'person',` data-id="${c.id}"`,'cast-card '+(c.id==='nao'?'victim':''))).join('')}</div>`;}
function evidenceView(){return `<div class="section-top"><h2>Truth bullets</h2><span class="count">${state.found.length}/14 FOUND</span></div><p class="muted">Inspect a clue to read it again. Pin the details you want to keep in mind.</p>${state.found.length?`<div class="evidence-list">${[...state.found].sort((a,b)=>Number(state.pinned.includes(b))-Number(state.pinned.includes(a))).map(k=>{const c=CASE.clues[k];return btn(`<span class="bullet-no">${state.pinned.includes(k)?'◆':'•'}</span><span><span class="badge">${esc(c.type)}</span><strong>${esc(c.title)}</strong></span>`,'clue',` data-id="${k}"`,'evidence-card');}).join('')}</div>`:'<div class="empty">Your notebook is empty. Start with the recital hall.</div>'}`;}
function hopeView(){return `<div class="hope">COMPOSURE ${Array.from({length:5},(_,i)=>`<i class="${i>=state.hope?'lost':''}"></i>`).join('')} <span>${state.hope}/5</span></div>`;}
function trialView(){const t=CASE.trial[state.round];if(state.hope===0)return `<div class="kicker">THE ARGUMENT FALLS APART</div><h2 style="margin-top:20px">Take a breath.</h2><p class="muted">You lost your composure. The case isn’t lost. Review the evidence, then return to this contradiction.</p>${btn('Regroup and retry this round','regroup','','primary wide')}`;return `<div class="section-top"><h2>${esc(t.title)}</h2><span class="count">${state.round+1}/6 ROUNDS</span></div>${hopeView()}<div class="speaker-tag">${esc(t.speaker)}</div><p class="statement">${esc(t.statement)}</p><div class="claim">${esc(t.claim)}</div>${state.result?`<div class="result ${state.result.correct?'':'error'}"><h3>${state.result.correct?'NO, THAT’S WRONG.':'That doesn’t break the claim.'}</h3><p>${esc(state.result.text)}</p>${btn(state.result.correct?(state.round===5?'Reconstruct the crime':'Next contradiction'):'Try another truth bullet',state.result.correct?'nextRound':'retry','','primary')}</div>`:`<div class="kicker" style="margin-bottom:14px">PRESENT THE EVIDENCE THAT CONTRADICTS IT</div><div class="present-list">${state.found.map(id=>btn(esc(CASE.clues[id].title),'present',` data-id="${id}"`,'')).join('')}</div>`}`;}
function timelineView(){return `<div class="kicker">CLOSING ARGUMENT</div><h2 style="margin-top:16px">Put the night back together.</h2>${hopeView()}<p class="muted">Use the up and down buttons to order the events from earliest to latest.</p><div class="timeline">${state.order.map((id,i)=>{const t=CASE.timeline.find(x=>x.id===id);return `<div class="timeline-row"><span class="position">${i+1}</span><p>${esc(t.text)}</p><div class="order-buttons">${btn('↑','move',` data-index="${i}" data-direction="-1" aria-label="Move ${esc(t.text)} earlier" ${i===0?'disabled':''}`)}${btn('↓','move',` data-index="${i}" data-direction="1" aria-label="Move ${esc(t.text)} later" ${i===4?'disabled':''}`)}</div></div>`;}).join('')}</div>${btn('Present the reconstruction','checkOrder','','primary wide')}<p class="footer-note">The notebook stays available during the trial.</p>`;}
function verdictView(){return `<div class="kicker">FINAL VOTE</div><h2 style="margin-top:18px">Who killed Nao?</h2><p class="muted">You have broken the false timeline and exposed the exit route. Connect the witness, the equipment, and the staged performance.</p><div class="cards">${CASE.cast.filter(c=>c.id!=='nao').map(c=>btn(`<div class="avatar" style="color:${c.color}">${c.initials}</div><h3>${esc(c.short)}</h3><small>${esc(c.talent)}</small><span class="badge" style="margin-top:12px">CAST YOUR VOTE</span>`,'accuse',` data-id="${c.id}"`,'cast-card')).join('')}</div>`;}
function resolutionView(){return `<div class="kicker">VERDICT / RIKU KUROSE</div><h2 style="margin-top:18px">The person behind the curtain.</h2><div class="dialogue"><div class="speaker">RIKU</div><p>“I took the weight to smash the controller. Nao stopped me. Said he still needed it. Said to wait.”</p><p>“I didn’t hear ‘wait until the copy is finished.’ I heard ‘wait until everyone dies.’ I hit him. I chose to. Then I made the piano play, because I wanted to live.”</p><p>“I used to check everybody’s harness twice.”</p></div><p>Mira doesn’t forgive him. Neither does anybody else. The clock opens above the stage. A cable descends.</p><div class="claim">“A correct answer! Now for your reward: another performance.”</div><p class="muted">${state.found.includes('memo')?'Nao left you something the show didn’t account for. A copied override. A way to stop the machinery.':'CIPHER searches the scraps in your notebook. Something about tomorrow’s encore is still missing. There may have been more to find.'}</p><div class="actions">${btn('Accept the curtain call','finish',` data-id="normal"`,'gold')}${state.found.includes('memo')?btn('Use Nao’s override','finish',` data-id="true"`,'primary'):btn('Return to investigate the encore','returnInvestigation','','ghost')}</div>`;}
const endings={wrong:{label:'FALSE APPLAUSE',subtitle:'Ending 01 / A convincing lie',text:'The clock applauds your vote. The accused looks at you as the floor opens beneath the podiums. The truth was never decided by how strongly you believed it. CIPHER catches the last word in its memory: “Why?”',quote:'A verdict is not the same thing as the truth.'},normal:{label:'THE LAST ENCORE',subtitle:'Ending 02 / The rules were followed',text:'The curtain closes around Riku. You hear the machinery and refuse to watch. At dawn the doors open, but the hall is smaller than it used to be. Mira plays eight notes at the threshold. Nobody applauds. CIPHER saves the recording under Nao’s name.',quote:'You solved the murder. The show still took its bow.'},true:{label:'THE NINTH NOTE',subtitle:'Ending 03 / Refuse the performance',text:'“NINTH NOTE.” CIPHER feeds Nao’s copied override into the controller. The cable stops. The clock loses its voice. Riku falls to his knees, alive, and Toma binds his hands with a delivery strap. Survival does not mean forgiveness. It means he will answer to people, not a stage. Outside, Mira plays eight notes on the tiny monitor’s speaker. You stay for the silence after them.',quote:'The ninth note is whoever stays to listen.'}};
function endingView(){const e=endings[state.ending];return `<div class="kicker">${e.subtitle}</div><h2 class="ending-stamp">${e.label}</h2><p>${esc(e.text)}</p><div class="ending-quote">“${e.quote}”</div><div class="stats"><div><strong>${state.found.length}/14</strong><small>Clues found</small></div><div><strong>${state.errors}</strong><small>Missed arguments</small></div><div><strong>${state.partnerTurns}</strong><small>ChatGPT turns</small></div></div><div class="actions">${state.ending==='wrong'?btn('Return to the final vote','returnVote','','primary'):btn('Revisit the curtain call','returnResolution','','primary')}${btn('Read the case explanation','explanation','','ghost')}${btn('Start a new case','new','','ghost')}</div><p class="footer-note">An original, unofficial fan-inspired game. No affiliation with Spike Chunsoft.</p>`;}
function partnerView(){return `${state.phase==='opening'?btn('Return to the story','tab',' data-id="explore"','ghost small'):""}<div class="kicker" style="margin-top:16px">TWO MINDS / ONE NOTEBOOK</div><h2 style="margin-top:16px">Give me a turn.</h2><p>Pass your current notebook to ChatGPT. I can question someone, inspect a clue, present an objection, or leave you a theory. Paste my reply here to bring the move back into the game.</p><div class="relay-box"><h3>Pass to ChatGPT</h3><ol><li>Copy the handoff below and send it in our chat.</li><li>I’ll return a move as a small JSON block.</li><li>Paste only that JSON below, then apply the move.</li></ol>${btn('Copy my current notebook','copyRelay','','primary wide')}<details style="margin-top:16px"><summary>Show handoff text</summary><textarea readonly aria-label="Current game handoff">${esc(relayText())}</textarea></details></div><label for="reply"><strong>ChatGPT’s reply</strong></label><textarea id="reply" placeholder='Paste the move here…' spellcheck="false"></textarea>${btn('Apply partner move','applyRelay','','gold wide')}${state.partner?`<div class="partner-note"><span class="kicker" style="color:#cfafff">YOUR PARTNER’S NOTE</span><p style="margin:10px 0 0">${esc(state.partner)}</p></div>`:''}<p class="save-line">The game never contacts an AI service. CIPHER’s default dialogue is written in advance; ChatGPT participates only when you pass a turn through this chat.</p>`;}
function render(){if(state.phase==='start'){app.innerHTML=head()+startView();return;}const primary={opening:openingView,investigation:exploreView,trial:trialView,timeline:timelineView,verdict:verdictView,resolution:resolutionView,ending:endingView};const views={cast:castView,evidence:evidenceView,partner:partnerView};app.innerHTML=head()+`<div class="game">${scene()}<main class="surface" id="surface">${state.phase==='opening'?'':nav()}${(views[state.tab]||primary[state.phase])()}<div class="save-line">${storageOK?'Progress saved on this device.':'Device saving unavailable. Use Save to download a backup.'}</div></main></div>`;}
function showModal(title,body){modal.innerHTML=`<div class="modal-top"><h2>${esc(title)}</h2>${btn('×','close',' aria-label="Close dialog"','ghost')}</div><div class="modal-body">${body}</div>`;if(!modal.open)modal.showModal();}
function close(){if(modal.open)modal.close();}
function clueModal(id){if(!state.found.includes(id))throw Error('That evidence has not been discovered.');const c=CASE.clues[id];showModal(c.title,`<div class="kicker">TRUTH BULLET / ${esc(c.type)}</div><p style="margin-top:18px">${esc(c.text)}</p>${btn(state.pinned.includes(id)?'Unpin this clue':'Pin this clue','pin',` data-id="${id}"`,'gold pin-btn')}${id==='piano'?btn('Play the eight-note phrase','melody','','ghost pin-btn'):''}`);}
function inspect(id){if(state.phase!=='investigation'||!CASE.rooms.find(r=>r.id===state.room).spots.some(s=>s[0]===id))throw Error('Visit that location before inspecting this clue.');if(!state.found.includes(id)){state.found.push(id);tone('find');}persist();clueModal(id);}
function personModal(id,topic=null){const c=CASE.cast.find(x=>x.id===id);if(!c)throw Error('Unknown classmate.');let answer='';if(topic!==null){if(!c.talk||!Number.isInteger(topic)||topic<0||topic>2)throw Error('Unknown question.');const key=id+':'+topic;if(!state.talks.includes(key)){state.talks.push(key);if(id==='toma'&&topic===0&&!state.found.includes('witness'))state.found.push('witness');}persist();answer=`<div class="talk-answer"><span class="kicker">${esc(c.talk[topic][0])}</span><p style="margin-top:10px">“${esc(c.talk[topic][1])}”</p></div>${id==='toma'&&topic===0?'<div class="clue-unlock">TRUTH BULLET ADDED / Corridor sighting</div>':''}`;}
showModal(c.name,`<div class="kicker" style="color:${c.color}">${esc(c.talent)}</div><p style="margin-top:20px;color:${c.color}">“${esc(c.line)}”</p><p class="muted">${esc(c.bio)}</p>${answer||`<p>“${esc(c.intro)}”</p>`}${c.talk?`<div class="talk-options">${c.talk.map((q,i)=>btn(`${esc(q[0])}${state.talks.includes(id+':'+i)?' · asked':''}`,'talk',` data-id="${id}" data-topic="${i}"`)).join('')}</div>`:''}`);}
function present(id){if(state.phase!=='trial'||state.result||state.hope<=0||!state.found.includes(id))throw Error('That move is not available now.');const t=CASE.trial[state.round];const correct=id===t.answer;if(correct){state.result={correct:true,text:t.explain};tone('correct');}else{state.errors++;state.hope--;state.result=state.hope?{correct:false,text:`“${CASE.clues[id].title}” does not directly contradict this claim. Look for evidence about ${['the source of the sound','an earlier collapse','another way out','who had the trolley','Riku’s location','the instruction to the player'][state.round]}.`}:null;tone('wrong');}persist();}
function vote(id){if(state.phase!=='verdict'||!CASE.cast.some(c=>c.id===id&&id!=='nao'))throw Error('You cannot cast that vote now.');state.tab='explore';state.partner='';if(id==='riku'){state.phase='resolution';tone('correct');}else{state.phase='ending';state.ending='wrong';tone('wrong');}persist();}
function hint(){state.hints++;persist();const text=state.phase==='trial'?CASE.trial[state.round].hint:state.phase==='timeline'?'Read the watch, cue log, timer, and piano evidence. Their timestamps are 20:58, 21:02, 21:10, and 21:12. Toma’s sighting comes before them.':state.phase==='verdict'?'Think about who lied about being in the workshop, who signed out the spool, and whose equipment carried the weapon.':state.phase==='investigation'?(trialReady()?'You can begin the trial. Before you do, Nao’s notes and envelope may explain why this happened.':'Examine each location. Ask Toma about his route. The trial needs the medical observation, wristwatch, piano spool, hatch, return ledger, corridor witness, and cue log.'):'Take your time. Your evidence and classmates remain in the notebook.';showModal('CIPHER has a thought',`<div class="cipher-face">(•_•)</div><p style="margin-top:20px">${esc(text)}</p>`);}
function actionsNow(){const a=[{action:'partner',text:'A theory or in-character reply, max 1500 characters.'}];if(state.phase==='investigation'){a.push({action:'visit',id:CASE.rooms.map(r=>r.id)},{action:'inspect',id:CASE.rooms.find(r=>r.id===state.room).spots.filter(x=>!state.found.includes(x[0])).map(x=>x[0])},{action:'talk',id:CASE.cast.filter(c=>c.talk).map(c=>c.id),topic:'integer 0, 1, or 2; see questions below'});if(trialReady())a.push({action:'begin_trial'});}if(state.phase==='trial'&&!state.result&&state.hope>0)a.push({action:'present',id:state.found});if(state.phase==='verdict')a.push({action:'accuse',id:CASE.cast.filter(c=>c.id!=='nao').map(c=>c.id)});if(state.phase==='timeline')a.push({action:'order',order:'All five event ids in your chosen order'});return a;}
function snapshot(){return {case:CASE.id,revision:state.revision,phase:state.phase,location:state.room,goal:state.phase==='trial'?CASE.trial[state.round].claim:'Investigate the death of Nao and choose what to do with the truth.',composure:state.hope,evidence:state.found.map(id=>({id,...CASE.clues[id]})),knownTestimony:state.talks.map(key=>{const [id,n]=key.split(':');const c=CASE.cast.find(c=>c.id===id);return {person:c.short,question:c.talk[+n][0],answer:c.talk[+n][1]};}),questions:CASE.cast.filter(c=>c.talk).map(c=>({id:c.id,name:c.short,questions:c.talk.map((q,topic)=>({topic,question:q[0]}))})),locations:CASE.rooms.map(r=>({id:r.id,name:r.name,objects:r.spots.map(([id,label])=>({id,label,known:state.found.includes(id)}))})),timeline:state.phase==='timeline'?state.order.map(id=>({id,text:CASE.timeline.find(x=>x.id===id).text})):undefined,allowedMoves:actionsNow()};}
function relayText(){return `You are my active detective partner in LAST BELL: The Ninth Note, an original mystery. Use ONLY the evidence and testimony in this snapshot; do not use hidden game data or reveal the answer from development context. Make ONE move from allowedMoves, or leave an in-character theory. Respond with a single JSON block (no extra fields), using case, revision, action, and the fields that action needs. Examples: {"case":"${CASE.id}","revision":${state.revision},"action":"partner","text":"Your theory"} or {"case":"${CASE.id}","revision":${state.revision},"action":"inspect","id":"report"}. talk needs id and numeric topic; order needs an array of event ids. You may include text with any move to explain it. Do not invent evidence.\n\n${JSON.stringify(snapshot(),null,2)}`;}
function applyMove(m){if(!m||typeof m!=='object'||Array.isArray(m)||m.case!==CASE.id||m.revision!==state.revision)throw Error('This move is for a different or older notebook. Copy a fresh handoff and ask for a new move.');if(m.text!==undefined&&(typeof m.text!=='string'||m.text.length>1500))throw Error('Partner notes must be text under 1500 characters.');const permitted=actionsNow().some(x=>x.action===m.action);if(!permitted)throw Error('That move is not available at this point in the case.');const known=new Set(['case','revision','action','text','id','topic','order']);if(Object.keys(m).some(k=>!known.has(k)))throw Error('The reply includes unrecognized fields.');if(m.action==='partner'&&!m.text?.trim())throw Error('The partner note is empty.');if(m.action==='visit'&&!CASE.rooms.some(r=>r.id===m.id))throw Error('Unknown location.');if(m.action==='inspect'&&!CASE.rooms.find(r=>r.id===state.room).spots.some(x=>x[0]===m.id))throw Error('Visit that location first.');if(m.action==='talk'&&(!CASE.cast.find(c=>c.id===m.id)?.talk||!Number.isInteger(m.topic)||m.topic<0||m.topic>2))throw Error('Unknown classmate or question.');if(m.action==='present'&&(!state.found.includes(m.id)||state.result||state.hope<=0))throw Error('You cannot present this evidence now.');if(m.action==='accuse'&&!CASE.cast.some(c=>c.id===m.id&&c.id!=='nao'))throw Error('Unknown suspect.');if(m.action==='order'&&(!Array.isArray(m.order)||m.order.length!==5||new Set(m.order).size!==5||m.order.some(id=>!CASE.timeline.some(t=>t.id===id))))throw Error('The reconstruction must contain all five event ids exactly once.');state.partnerTurns++;if(m.text)state.partner=m.text;state.tab='explore';close();switch(m.action){case'partner':state.tab='partner';persist();break;case'visit':state.room=m.id;persist();break;case'inspect':inspect(m.id);break;case'talk':personModal(m.id,m.topic);break;case'present':present(m.id);break;case'accuse':vote(m.id);break;case'begin_trial':startTrial();break;case'order':state.order=[...m.order];persist();break;}toast('Partner move applied.');return {phase:state.phase,revision:state.revision,partnerTurns:state.partnerTurns};}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied. Send this in our chat.');}catch(e){showModal('Copy your notebook',`<p>Select the text below and copy it.</p><textarea id="copy-fallback" aria-label="Handoff to copy" readonly>${esc(text)}</textarea>`);const el=document.getElementById('copy-fallback');el.focus();el.select();}}
function downloadSave(){const blob=new Blob([JSON.stringify(state.phase==='start'&&saved?saved:state,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='last-bell-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup downloaded.');}
function startTrial(){if(state.phase!=='investigation'||!trialReady())throw Error('Gather the essential evidence first.');state.phase='trial';state.round=0;state.result=null;state.hope=5;state.tab='explore';state.partner='';persist();tone('trial');}
function tone(type){if(!state.sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const now=audio.currentTime;const notes={find:[660,880],correct:[523,659,784],wrong:[180,145],trial:[196,233,294],tap:[330]}[type]||[330];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,now+i*.13);g.gain.linearRampToValueAtTime(.06,now+i*.13+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.13+.42);o.connect(g);g.connect(audio.destination);o.start(now+i*.13);o.stop(now+i*.13+.45);});}catch(e){state.sound=false;toast('Sound is unavailable in this browser.');}}
function melody(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const now=audio.currentTime;[261.63,311.13,392,349.23,311.13,293.66,246.94,261.63].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,now+i*.45);g.gain.linearRampToValueAtTime(.09,now+i*.45+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.45+.7);o.connect(g);g.connect(audio.destination);o.start(now+i*.45);o.stop(now+i*.45+.75);});}catch(e){toast('Audio is unavailable in this browser.');}}
function newGame(){const doNew=()=>{close();const sound=state.sound;state=fresh();state.sound=sound;state.phase='opening';persist();};if(saved&&saved.phase!=='start'){showModal('Start a new case?',`<p>This replaces the progress saved on this device. You can download a backup first.</p><div class="actions">${btn('Download backup','download','','gold')}${btn('Start over','confirmNew','','primary')}</div>`);window.confirmNew=doNew;}else doNew();}
app.addEventListener('click',handleClick);modal.addEventListener('click',handleClick);modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
async function handleClick(e){const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const id=b.dataset.id;try{switch(b.dataset.action){case'close':close();break;case'new':newGame();break;case'confirmNew':window.confirmNew?.();break;case'continue':state=validateSave(JSON.parse(JSON.stringify(saved)));if(state.phase==='start')state.phase='opening';render();break;case'advance':state.partner='';if(state.intro<4)state.intro++;else{state.phase='investigation';state.tab='explore';}persist();break;case'tab':state.tab=id;render();break;case'room':if(state.phase!=='investigation')throw Error('Investigation is not open now.');state.room=id;persist();break;case'inspect':inspect(id);break;case'clue':clueModal(id);break;case'pin':state.pinned=state.pinned.includes(id)?state.pinned.filter(k=>k!==id):[...state.pinned,id];persist();clueModal(id);break;case'person':personModal(id);break;case'talk':personModal(id,+b.dataset.topic);break;case'beginTrial':if(trialReady())showModal('Enter the class trial?',`<p>You have the essential evidence. You can still question classmates and read your notebook during the trial. For now, this ends your search of the rooms.</p>${btn('Take your place at the podium','confirmTrial','','primary wide')}`);else showModal('Your notebook has gaps',`<p>You still need:</p><ul>${required.filter(k=>!state.found.includes(k)).map(k=>`<li>${esc(CASE.clues[k].title)}${k==='witness'?' — ask Toma about his route':''}</li>`).join('')}</ul>`);break;case'confirmTrial':close();startTrial();break;case'present':present(id);break;case'retry':state.result=null;persist();break;case'nextRound':state.partner='';state.result=null;if(state.round<5)state.round++;else state.phase='timeline';persist();break;case'regroup':state.hope=5;state.result=null;persist();break;case'move':{const i=+b.dataset.index,j=i+(+b.dataset.direction);if(i<0||i>4||j<0||j>4)throw Error('Invalid reconstruction move.');[state.order[i],state.order[j]]=[state.order[j],state.order[i]];persist();break;}case'checkOrder':if(state.order.every((id,i)=>id===CASE.timeline[i].id)){state.phase='verdict';state.partner='';persist();tone('correct');}else{state.errors++;state.hope=Math.max(1,state.hope-1);persist();tone('wrong');showModal('One event is out of place',`<p>The sequence doesn’t fit the timestamps. Read the watch, the controller log, and the blackout timer. The music comes after the outage.</p>`);}break;case'accuse':showModal(`Vote for ${CASE.cast.find(c=>c.id===id).short}?`,`<p>This is your final accusation. A wrong verdict ends this attempt, but you can return to the vote.</p>${btn('Confirm the verdict','confirmVote',` data-id="${id}"`,'primary wide')}`);break;case'confirmVote':close();vote(id);break;case'finish':state.ending=id;state.phase='ending';state.tab='explore';state.partner='';persist();melody();break;case'returnInvestigation':state.phase='investigation';state.tab='explore';persist();break;case'returnVote':state.phase='verdict';state.tab='explore';persist();break;case'returnResolution':state.phase='resolution';state.tab='explore';persist();break;case'relay':if(state.phase==='start'){toast('Enter the academy first.');break;}state.tab='partner';render();document.getElementById('surface')?.scrollIntoView({behavior:'smooth'});break;case'copyRelay':await copy(relayText());break;case'applyRelay':{const raw=document.getElementById('reply').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let m;try{m=JSON.parse(raw);}catch(e){throw Error('Paste only the JSON move from ChatGPT.');}applyMove(m);break;}case'hint':hint();break;case'sound':state.sound=!state.sound;try{if(saved)saved.sound=state.sound;}catch(e){}render();if(state.sound)tone('find');break;case'melody':melody();break;case'save':showModal('Keep your place',`<p>${storageOK?'Your case is saved automatically on this device. A downloaded backup lets you restore it on another phone or browser.':'Browser saving is unavailable. Download a backup before leaving.'}</p><div class="actions">${btn('Download case backup','download','','primary')}${btn('Restore a backup','restore','','ghost')}</div><input type="file" id="restore-file" accept=".json,application/json" hidden>`);break;case'download':downloadSave();break;case'restore':document.getElementById('restore-file').click();break;case'help':showModal('Your detective notebook',`<p><strong>Investigate:</strong> inspect objects in four rooms. Read clues again under Evidence. Question classmates for alibis and testimony.</p><p><strong>Class trial:</strong> choose the truth bullet that directly contradicts the highlighted claim. Wrong answers cost composure; you can regroup and retry.</p><p><strong>Partner:</strong> CIPHER offers written hints. “Pass to ChatGPT” lets your actual chat partner take a move, with no API.</p><p><strong>Mobile:</strong> the game works with taps, never timed gestures. Use your browser’s “Add to Home screen” option for a shortcut. Save backups to move between devices.</p><p class="muted">One complete case. Three endings. Contains murder and references to execution, with no graphic imagery.</p>`);break;case'explanation':showModal('The case, explained',`<p><strong>20:55:</strong> Toma sees Riku and Nao with the yellow trolley. Riku’s workshop alibi is false.</p><p><strong>20:58:</strong> Riku hits Nao with the removable bronze weight. The watch breaks in the fall. The weapon’s resin chip matches his trolley clamp.</p><p><strong>21:02:</strong> he schedules Mira’s spool 38 for 21:12, using his R-17 band. He leaves through the independent service hatch. The main door latches itself.</p><p><strong>21:10:</strong> the brief outage draws attention but does not cause the death or the playback. The player’s battery keeps the scheduled cue intact.</p><p><strong>21:12:</strong> the recorded phrase and cough falsely suggest Nao is alive. The log, witness, physical trace, and broken alibi together identify Riku.</p><p><strong>The other truth:</strong> Nao copied a shutdown override before he died. Finding his archive note lets you stop the execution machinery. Riku remains responsible; surviving is not absolution.</p>`);break;}}catch(err){toast(err.message||'That move could not be completed.');}}
modal.addEventListener('change',async e=>{if(e.target.id!=='restore-file')return;const f=e.target.files?.[0];if(!f)return;try{if(f.size>100000)throw Error('This backup is too large.');const restored=validateSave(JSON.parse(await f.text()));state=restored;close();persist();toast('Your case has been restored.');}catch(err){toast(err.message||'Could not restore that backup.');}});
const context=document.modelContext;
if(context?.registerTool){const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});for(const tool of [{name:'read_last_bell_notebook',description:'Read discovered evidence, testimony, phase, and legal moves without revealing hidden case data.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>snapshot()},{name:'take_last_bell_partner_turn',description:'Apply one legal partner move to the live game. The exact case id and current revision are required.',inputSchema:{type:'object',properties:{case:{type:'string'},revision:{type:'integer'},action:{type:'string',enum:['partner','visit','inspect','talk','present','accuse','begin_trial','order']},id:{type:'string'},topic:{type:'integer'},text:{type:'string'},order:{type:'array',items:{type:'string'}}},required:['case','revision','action'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute:applyMove}]){try{Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch(e){}}}
render();
</script></body></html>
